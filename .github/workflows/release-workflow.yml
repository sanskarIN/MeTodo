name: Build Web Release Candidate

# Stage 1: build a reviewed web artifact from protected main. Never publish.
# Android signing and native distributions are deliberately out of v1.0.0 scope.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Exact package.json version (for example 1.0.0)"
        type: string
        required: true
      approvedCommit:
        description: "Full reviewed SHA on protected main"
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: metodo-manual-release
  cancel-in-progress: false

jobs:
  web:
    name: Build verified web candidate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact source and tags
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Enforce reviewed protected-main source and version
        shell: bash
        env:
          APPROVED_SHA: ${{ inputs.approvedCommit }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Release candidates must come from protected main."
            exit 1
          fi
          if [[ ! "$APPROVED_SHA" =~ ^[0-9a-f]{40}$ ]] || [[ "$APPROVED_SHA" != "$GITHUB_SHA" ]]; then
            echo "::error::Approved SHA must equal the checked-out main commit."
            exit 1
          fi
          APP_VERSION="$(node -p "require('./package.json').version")"
          if [[ "$RELEASE_VERSION" != "$APP_VERSION" ]]; then
            echo "::error::Requested version must equal package.json version."
            exit 1
          fi
          if git show-ref --verify --quiet "refs/tags/v$RELEASE_VERSION"; then
            echo "::error::Release tag already exists; do not overwrite a stable release."
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22.13.0"
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Refuse critical or high production dependency advisories
        run: pnpm audit --prod --audit-level high

      - name: TypeScript
        run: pnpm check

      - name: Unit tests
        run: pnpm test

      - name: Lint
        run: pnpm lint

      - name: Build server bundle
        run: pnpm build

      - name: Export production browser app
        run: pnpm exec expo export --platform web --output-dir dist/web

      - name: Verify and package static web archive
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          test -s dist/web/index.html
          test "$(find dist/web -type f | wc -l)" -gt 1
          tar -czf "dist/MeTodo-v$RELEASE_VERSION-web.tar.gz" -C dist/web .
          test -s "dist/MeTodo-v$RELEASE_VERSION-web.tar.gz"
          tar -tzf "dist/MeTodo-v$RELEASE_VERSION-web.tar.gz" > /dev/null
          (
            cd dist
            sha256sum "MeTodo-v$RELEASE_VERSION-web.tar.gz" > SHA256SUMS-candidate
            cat SHA256SUMS-candidate
          )

      - name: Upload web candidate without publishing
        uses: actions/upload-artifact@v4
        with:
          name: metodo-candidate-web
          path: |
            dist/MeTodo-v*-web.tar.gz
            dist/SHA256SUMS-candidate
          if-no-files-found: error
          retention-days: 30
