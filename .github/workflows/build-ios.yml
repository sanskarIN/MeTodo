name: Build iOS

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  NODE_VERSION: '22.13.0'

permissions:
  contents: read

jobs:
  build:
    name: Build iOS Simulator
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate iOS native project
        run: pnpm exec expo prebuild --platform ios --no-install --non-interactive
      - name: Install CocoaPods
        working-directory: ios
        run: pod install
      - name: Build iOS simulator app
        run: xcodebuild -workspace ios/metodo.xcworkspace -scheme metodo -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO -derivedDataPath ios/build build
      - name: Upload iOS simulator app
        uses: actions/upload-artifact@v4
        with:
          name: metodo-ios-simulator
          path: ios/build/Build/Products/Debug-iphonesimulator/*.app
          if-no-files-found: error
          retention-days: 14
      - name: Build report
        if: always()
        run: |
          echo "## iOS Build Report" >> "$GITHUB_STEP_SUMMARY"
          echo "Unsigned simulator build completed with status: ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"

  test:
    name: Test iOS Build
    runs-on: macos-14
    needs: build
    if: github.event_name == 'pull_request'
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run tests
        run: pnpm test
      - name: Check TypeScript
        run: pnpm check
      - name: Run linter
        run: pnpm lint
