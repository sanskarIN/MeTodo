name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: '22.13.0'
  PNPM_VERSION: '9.12.0'

jobs:
  validate:
    name: Validate MeTodo
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript validation
        run: pnpm check

      - name: Unit tests
        run: pnpm test

      - name: Production server bundle
        run: pnpm build

      - name: Lint validation
        run: pnpm lint

      - name: Validate both manual release workflow definitions
        run: |
          pnpm exec prettier .github/workflows/release-workflow.yml --parser yaml > /dev/null
          pnpm exec prettier .github/workflows/publish-stable.yml --parser yaml > /dev/null

      - name: Validate EAS download helper syntax
        run: node --check scripts/download-eas-android-build.mjs

      - name: Web export validation
        run: pnpm exec expo export --platform web

      - name: Audit production dependencies
        timeout-minutes: 5
        run: pnpm audit --prod --audit-level high
