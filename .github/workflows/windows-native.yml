name: Windows Native Installer (Trial)

# Build an actual Windows installer as a CI artifact. Never publish a release.
on:
  pull_request:
    paths:
      - "src-tauri/**"
      - "app/**"
      - "components/**"
      - "lib/**"
      - "global.css"
      - "scripts/windows-web-smoke.mjs"
      - "scripts/windows-diagnostic-bootstrap.js"
      - "scripts/prepare-windows-export.mjs"
      - "scripts/windows-native-webview2-smoke.mjs"
      - "scripts/windows-native-uia-probe.ps1"
      - "tests/windows-viewport-layout.test.ts"
      - "tests/windows-diagnostic-export.test.ts"
      - "tests/windows-native-runtime-smoke.test.ts"
      - "assets/images/icon.png"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tests/windows-native-workflow.test.ts"
      - ".github/workflows/windows-native.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: metodo-windows-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installer:
    name: Build Windows NSIS installer
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      CARGO_TERM_COLOR: always
      METODO_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Ensure source provenance matches exact PR head
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:METODO_SOURCE_SHA) {
            throw "Ref mismatch: checked out $actual instead of intended $env:METODO_SOURCE_SHA"
          }
          "Trial source SHA: $actual" | Out-File $env:GITHUB_STEP_SUMMARY -Append

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: pnpm

      - name: Setup Rust stable for native Windows
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install locked JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Ensure Cargo.lock is committed and unchanged
        shell: pwsh
        run: |
          if (-not (Test-Path "src-tauri/Cargo.lock")) { throw "Cargo.lock must be committed" }
          cargo metadata --locked --manifest-path src-tauri/Cargo.toml --no-deps --format-version 1 | Out-Null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify TypeScript, tests, lint and security audit
        shell: pwsh
        run: |
          pnpm check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm lint
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm audit --prod --audit-level high
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Smoke-test production web UI geometry in Microsoft Edge
        shell: pwsh
        run: |
          pnpm desktop:windows:export
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/windows-web-smoke.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build native Windows installer with offline WebView2 runtime
        id: build_native
        shell: pwsh
        run: |
          pnpm desktop:windows:build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Probe compiled Tauri WebView2 runtime (required for green Windows CI)
        shell: pwsh
        run: |
          node scripts/windows-native-webview2-smoke.mjs
          $probeExit = $LASTEXITCODE
          $report = "dist/windows-native/NATIVE_WEBVIEW2_SMOKE.txt"
          if (-not (Test-Path $report)) {
            New-Item -ItemType Directory -Force "dist/windows-native" | Out-Null
            "Native Windows WebView2 test: NOT VERIFIED`nProbe terminated before writing diagnostics. Exit code: $probeExit" |
              Set-Content -LiteralPath $report -Encoding utf8
          }
          Get-Content -LiteralPath $report | Out-File $env:GITHUB_STEP_SUMMARY -Append
          if ($probeExit -ne 0) {
            Write-Warning "Native renderer runtime not proven; see NATIVE_WEBVIEW2_SMOKE.txt."
            exit $probeExit
          }

      - name: Require actual Windows installer and write checksums
        id: checksums
        if: ${{ always() && steps.build_native.outcome == 'success' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installers = @(Get-ChildItem "src-tauri/target/release/bundle/nsis" -Filter "*-setup.exe" -File)
          if ($installers.Count -ne 1) {
            throw "Expected exactly one native NSIS setup.exe; found $($installers.Count)"
          }
          New-Item -ItemType Directory -Force "dist/windows-native" | Out-Null
          $version = node -p "require('./package.json').version"
          $revision = $env:METODO_SOURCE_SHA.Substring(0, 12)
          $destination = "dist/windows-native/MeTodo-v$version-windows-x64-trial-$revision-setup.exe"
          Copy-Item -LiteralPath $installers[0].FullName -Destination $destination
          if ((Get-Item $destination).Length -lt 1024) { throw "Installer is unexpectedly small" }
          $digest = (Get-FileHash -LiteralPath $destination -Algorithm SHA256).Hash.ToLowerInvariant()
          "$digest  $([System.IO.Path]::GetFileName($destination))" |
            Set-Content "dist/windows-native/SHA256SUMS" -Encoding ascii
          $signature = Get-AuthenticodeSignature -LiteralPath $destination
          "Installer SHA256: $digest" | Out-File $env:GITHUB_STEP_SUMMARY -Append
          "Authenticode status (trial only): $($signature.Status)" |
            Out-File $env:GITHUB_STEP_SUMMARY -Append
          if ($signature.Status -ne "Valid") {
            Write-Host "Unsigned trial build. Do not release as a trusted stable installer."
          }

      - name: Upload trial installer without publishing
        if: ${{ always() && steps.checksums.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: metodo-windows-native-trial
          path: |
            dist/windows-native/MeTodo-v*-windows-x64-trial-*-setup.exe
            dist/windows-native/SHA256SUMS
            dist/windows-native/NATIVE_WEBVIEW2_SMOKE.txt
            dist/windows-native/WINDOWS_TRIAL_RENDER.png
          if-no-files-found: error
          retention-days: 14
