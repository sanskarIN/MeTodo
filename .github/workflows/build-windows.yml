name: Build Windows

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  NODE_VERSION: '22.13.0'

permissions:
  contents: read

jobs:
  build:
    name: Validate Windows Desktop
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate production server bundle
        run: pnpm build
      - name: Export web package for Windows distribution validation
        run: pnpm exec expo export --platform web --output-dir dist/windows-web
      - name: Upload Windows validation package
        uses: actions/upload-artifact@v4
        with:
          name: metodo-windows-web-validation
          path: dist/windows-web
          if-no-files-found: error
          retention-days: 14
      - name: Build report
        if: always()
        shell: pwsh
        run: |
          Add-Content $env:GITHUB_STEP_SUMMARY "## Windows Build Report`n"
          Add-Content $env:GITHUB_STEP_SUMMARY "Windows-compatible production validation completed with status: ${{ job.status }}`n"

  test:
    name: Test Windows Build
    runs-on: windows-latest
    needs: build
    if: github.event_name == 'pull_request'
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run tests
        run: pnpm test
      - name: Check TypeScript
        run: pnpm check
      - name: Run linter
        run: pnpm lint
