name: Build Windows

on:
  push:
    branches:
      - main
      - develop
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

env:
  NODE_VERSION: "22.13.0"

jobs:
  build:
    name: Build Windows Installers
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build server bundle
        run: pnpm build

      - name: Export Expo web compatibility bundle
        run: pnpm exec expo export --platform web --output-dir dist/web

      - name: Upload web compatibility bundle
        uses: actions/upload-artifact@v5
        with:
          name: metodo-windows-compatibility
          path: dist/web
          retention-days: 30

      - name: Generate build report
        if: always()
        run: |
          Add-Content $env:GITHUB_STEP_SUMMARY "## Windows Build Report`n"
          Add-Content $env:GITHUB_STEP_SUMMARY "`n**Build Status:** ${{ job.status }}`n"
          Add-Content $env:GITHUB_STEP_SUMMARY "**Branch:** ${{ github.ref }}`n"
          Add-Content $env:GITHUB_STEP_SUMMARY "**Commit:** ${{ github.sha }}`n"
          Add-Content $env:GITHUB_STEP_SUMMARY "**Triggered by:** ${{ github.actor }}`n"

  test:
    name: Test Windows Build
    runs-on: windows-latest
    needs: build
    if: github.event_name == 'pull_request'
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Run linter
        run: pnpm lint

      - name: Check TypeScript
        run: pnpm check

  publish:
    name: Publish Windows Installers
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Download artifacts
        uses: actions/download-artifact@v5

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            metodo-windows-compatibility/**
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify deployment
        uses: 8398a7/action-slack@v3
        if: always()
        with:
          status: ${{ job.status }}
          text: "Windows build ${{ job.status }}: ${{ github.ref }}"
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
          fields: repo,message,commit,author
